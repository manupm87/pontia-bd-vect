[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aurum-market-discovery-engine"
version = "1.0.0"
description = "Motor de descubrimiento semántico y control de catálogo para Aurum Market sobre una base de datos vectorial"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.2,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.3,<6",
]
pdf = [
    "markdown>=3.7,<4",
    "weasyprint>=63,<70",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aurum_discovery"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requiere una instancia de Qdrant accesible (docker compose -f deploy/qdrant/compose.yaml up -d)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
