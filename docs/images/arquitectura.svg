<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .capa { fill: #f7fafc; stroke: #cbd5e0; rx: 10; }
    .caja { fill: #ffffff; stroke: #4a5568; stroke-width: 1.2; rx: 8; }
    .destacada { fill: #ebf4ff; stroke: #2b6cb0; stroke-width: 1.6; rx: 8; }
    .artefacto { fill: #f0fff4; stroke: #2f855a; stroke-width: 1.2; rx: 8; }
    .titulo { font-size: 15px; font-weight: bold; fill: #1a202c; }
    .texto { font-size: 12.5px; fill: #2d3748; }
    .detalle { font-size: 11px; fill: #718096; }
    .flecha { stroke: #4a5568; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="480" y="28" text-anchor="middle" class="titulo" font-size="18">Aurum Market · Arquitectura del motor de descubrimiento</text>

  <!-- Capa datos -->
  <rect x="20" y="50" width="200" height="560" class="capa"/>
  <text x="120" y="74" text-anchor="middle" class="titulo">Datos</text>
  <rect x="35" y="90" width="170" height="72" class="caja"/>
  <text x="120" y="112" text-anchor="middle" class="texto">catalogo_productos</text>
  <text x="120" y="128" text-anchor="middle" class="detalle">15.000 fichas · UUIDv5</text>
  <text x="120" y="144" text-anchor="middle" class="detalle">brand / color / active</text>
  <rect x="35" y="180" width="170" height="58" class="caja"/>
  <text x="120" y="202" text-anchor="middle" class="texto">consultas</text>
  <text x="120" y="218" text-anchor="middle" class="detalle">desarrollo · ciegas · filtradas</text>
  <rect x="35" y="256" width="170" height="58" class="caja"/>
  <text x="120" y="278" text-anchor="middle" class="texto">altas entrantes</text>
  <text x="120" y="294" text-anchor="middle" class="detalle">14 desarrollo + 14 ciegas</text>
  <rect x="35" y="332" width="170" height="58" class="caja"/>
  <text x="120" y="354" text-anchor="middle" class="texto">eventos_catalogo</text>
  <text x="120" y="370" text-anchor="middle" class="detalle">16 UPSERT + 8 DELETE</text>
  <rect x="35" y="410" width="170" height="58" class="caja"/>
  <text x="120" y="432" text-anchor="middle" class="texto">relevancias ESCI</text>
  <text x="120" y="448" text-anchor="middle" class="detalle">E=3 · S=2 · C=1 · I=0</text>

  <!-- Capa representación -->
  <rect x="250" y="50" width="200" height="330" class="capa"/>
  <text x="350" y="74" text-anchor="middle" class="titulo">Representación</text>
  <rect x="265" y="90" width="170" height="86" class="destacada"/>
  <text x="350" y="112" text-anchor="middle" class="texto">multilingual-e5-small</text>
  <text x="350" y="128" text-anchor="middle" class="detalle">384d · L2-normalizado</text>
  <text x="350" y="144" text-anchor="middle" class="detalle">passage: / query:</text>
  <text x="350" y="160" text-anchor="middle" class="detalle">composición: título+marca+color</text>
  <rect x="265" y="194" width="170" height="58" class="caja"/>
  <text x="350" y="216" text-anchor="middle" class="texto">alternativas evaluadas</text>
  <text x="350" y="232" text-anchor="middle" class="detalle">texto completo · MiniLM · BM25</text>
  <rect x="265" y="270" width="170" height="72" class="caja"/>
  <text x="350" y="292" text-anchor="middle" class="texto">data/embeddings/</text>
  <text x="350" y="308" text-anchor="middle" class="detalle">.npy + metadatos SHA-256</text>
  <text x="350" y="324" text-anchor="middle" class="detalle">procedencia verificable</text>

  <!-- Capa almacenamiento -->
  <rect x="480" y="50" width="220" height="330" class="capa"/>
  <text x="590" y="74" text-anchor="middle" class="titulo">Índice y base de datos</text>
  <rect x="495" y="90" width="190" height="120" class="destacada"/>
  <text x="590" y="112" text-anchor="middle" class="texto">Qdrant v1.18 (Docker)</text>
  <text x="590" y="130" text-anchor="middle" class="detalle">colección aurum-market-eval-*</text>
  <text x="590" y="146" text-anchor="middle" class="detalle">coseno · HNSW m=24 efc=120</text>
  <text x="590" y="162" text-anchor="middle" class="detalle">payload: brand (keyword index)</text>
  <text x="590" y="178" text-anchor="middle" class="detalle">ID de punto = record_id UUIDv5</text>
  <text x="590" y="194" text-anchor="middle" class="detalle">volumen persistente</text>
  <rect x="495" y="228" width="190" height="64" class="caja"/>
  <text x="590" y="250" text-anchor="middle" class="texto">ingesta por lotes</text>
  <text x="590" y="266" text-anchor="middle" class="detalle">idempotente · verifica recuento</text>
  <rect x="495" y="308" width="190" height="58" class="caja"/>
  <text x="590" y="330" text-anchor="middle" class="texto">mutaciones</text>
  <text x="590" y="346" text-anchor="middle" class="detalle">upsert / delete + visibilidad</text>

  <!-- Capa servicios -->
  <rect x="730" y="50" width="210" height="330" class="capa"/>
  <text x="835" y="74" text-anchor="middle" class="titulo">Recorridos</text>
  <rect x="745" y="90" width="180" height="86" class="destacada"/>
  <text x="835" y="112" text-anchor="middle" class="texto">Descubrimiento</text>
  <text x="835" y="128" text-anchor="middle" class="detalle">top-k configurable</text>
  <text x="835" y="144" text-anchor="middle" class="detalle">filtro brand en la consulta</text>
  <text x="835" y="160" text-anchor="middle" class="detalle">score nativo (similitud)</text>
  <rect x="745" y="194" width="180" height="86" class="destacada"/>
  <text x="835" y="216" text-anchor="middle" class="texto">Control de altas</text>
  <text x="835" y="232" text-anchor="middle" class="detalle">candidatos vectoriales</text>
  <text x="835" y="248" text-anchor="middle" class="detalle">umbral + margen calibrados</text>
  <text x="835" y="264" text-anchor="middle" class="detalle">señala product_id concreto</text>
  <rect x="745" y="298" width="180" height="58" class="caja"/>
  <text x="835" y="320" text-anchor="middle" class="texto">CLI / servicio</text>
  <text x="835" y="336" text-anchor="middle" class="detalle">resultados normalizados</text>

  <!-- Capa evaluación -->
  <rect x="250" y="410" width="690" height="200" class="capa"/>
  <text x="595" y="434" text-anchor="middle" class="titulo">Evaluación y artefactos</text>
  <rect x="265" y="450" width="200" height="72" class="caja"/>
  <text x="365" y="472" text-anchor="middle" class="texto">calidad del ranking</text>
  <text x="365" y="488" text-anchor="middle" class="detalle">nDCG@10 · Recall@10 · MRR@10</text>
  <text x="365" y="504" text-anchor="middle" class="detalle">baseline BM25 vs denso</text>
  <rect x="485" y="450" width="200" height="72" class="caja"/>
  <text x="585" y="472" text-anchor="middle" class="texto">fidelidad y latencia</text>
  <text x="585" y="488" text-anchor="middle" class="detalle">oráculo exacto vs HNSW</text>
  <text x="585" y="504" text-anchor="middle" class="detalle">p50 / p95 con calentamiento</text>
  <rect x="705" y="450" width="220" height="72" class="artefacto"/>
  <text x="815" y="468" text-anchor="middle" class="texto">resultados/</text>
  <text x="815" y="484" text-anchor="middle" class="detalle">resultados_busqueda.csv</text>
  <text x="815" y="498" text-anchor="middle" class="detalle">resultados_duplicados.csv</text>
  <text x="815" y="512" text-anchor="middle" class="detalle">metricas_desarrollo.json</text>
  <rect x="265" y="536" width="420" height="58" class="caja"/>
  <text x="475" y="558" text-anchor="middle" class="texto">config/run_config.yaml</text>
  <text x="475" y="574" text-anchor="middle" class="detalle">contrato reproducible de la ejecución final</text>
  <rect x="705" y="536" width="220" height="58" class="artefacto"/>
  <text x="815" y="558" text-anchor="middle" class="texto">informes .artifacts/</text>
  <text x="815" y="574" text-anchor="middle" class="detalle">ingesta · filtros · eventos · calibración</text>

  <!-- Flechas -->
  <path class="flecha" d="M205,126 L263,126"/>
  <path class="flecha" d="M350,176 L350,192"/>
  <path class="flecha" d="M350,252 L350,268"/>
  <path class="flecha" d="M435,306 L493,150"/>
  <path class="flecha" d="M205,209 L350,209 L350,194" stroke-dasharray="4 3"/>
  <path class="flecha" d="M205,361 L493,338"/>
  <path class="flecha" d="M687,150 L743,133"/>
  <path class="flecha" d="M687,150 L743,237"/>
  <path class="flecha" d="M205,285 L743,237" stroke-dasharray="4 3"/>
  <path class="flecha" d="M205,439 L365,448" stroke-dasharray="4 3"/>
  <path class="flecha" d="M590,380 L590,448"/>
  <path class="flecha" d="M835,384 L815,448"/>
</svg>
