name: bbdd-vectoriales-s03-weaviate
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2
    container_name: bbdd-vectoriales-s03-weaviate
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: bbdd-vectoriales-s03-weaviate-node
      DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  weaviate-data:
    name: bbdd-vectoriales-s03-weaviate-data
