[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vector-database-session"
version = "1.0.0"
description = "Sesión práctica sobre bases de datos vectoriales, cinco motores y LangChain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "jsonschema>=4.26,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=6.2,<7",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
pinecone = ["pinecone>=9.1,<10"]
chroma = ["chromadb>=1.5.9,<1.6"]
weaviate = ["weaviate-client>=4.22,<4.23"]
milvus = ["pymilvus[milvus-lite]>=2.6,<2.7"]
qdrant = ["qdrant-client>=1.18,<1.19"]
langchain = [
    "langchain-core>=1.0,<2",
    "langchain-chroma>=1.1,<1.2",
    "langchain-qdrant>=1.1,<1.2",
    "langchain-huggingface>=1.2,<1.3",
    "sentence-transformers>=5.2,<6",
]
pdf = [
    "pdfplumber>=0.11,<1",
    "pypdf>=6,<7",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_database_session"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: necesita un servicio Docker o Pinecone Cloud",
    "embedded: utiliza un motor local embebido",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
