[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-semantic-search-session"
version = "1.0.0"
description = "Sesión práctica de búsqueda semántica aplicada a un catálogo e-commerce real"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pillow>=10.4,<13",
    "plotly>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
api = [
    "cohere>=5.13,<6",
    "google-genai>=1.20,<2",
    "openai>=1.55,<3",
]
classics = [
    "gensim>=4.3.3,<5",
]
local = [
    "sentence-transformers>=3.3,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_search_session"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
