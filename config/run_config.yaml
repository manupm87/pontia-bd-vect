# Configuración utilizada en la ejecución final de la actividad Aurum Market.
# Este fichero es el contrato reproducible del sistema: los scripts lo leen al
# arrancar y las métricas entregadas se regeneran a partir de estos valores.
snapshot_id: aurum-market-vector-search-evaluation-v1
random_seed: 42

embedding:
  # Configuración ganadora de la validación ampliada sobre ESCI público
  # (make validate-challengers; ver
  # .artifacts/experimentos/validacion_ampliada.json y el informe). En las 8
  # consultas de desarrollo e5-large parecía el peor modelo title-only; con
  # 413/1986 consultas es el único que supera a e5-base con significación en
  # las tres métricas y gana a bge-m3 y Qwen3 en el pareado directo.
  configuration: e5_large_title

collection:
  distance: cosine
  hnsw:
    m: 24
    ef_construct: 120
  ef_search: 128
  batch_size: 256

retrieval:
  top_k: 10

metrics:
  # Declaración explícita de qué etiquetas ESCI cuentan como relevantes.
  # No puede cambiar silenciosamente entre experimentos.
  recall_relevant_labels: ["E", "S"]
  mrr_relevant_labels: ["E"]

fidelity:
  k: 10

latency:
  warmup: 5
  repeats: 30

duplicates:
  # Umbrales calibrados sobre altas_desarrollo.csv (ver
  # .artifacts/duplicados/calibracion.json). No se ajustan con la evaluación.
  # Criterio max-margin: punto medio del hueco 0.8978-0.9884 observado con
  # e5-large en desarrollo (F1 1.000 en todo el hueco).
  score_threshold: 0.943
  margin_threshold: 0.0
